[project]
name = "argos-reminder"
version = "0.1.0"
description = "ARGOS dashboard reminder notifier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
argos-reminder = "argos_reminder.cli:main"
argos-reminder-daemon = "argos_reminder.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=argos_reminder --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
