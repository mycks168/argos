rules:
  - keywords:
      - "知ってる"
      - "知ってる?"
      - "知ってる？"
      - "知ってますか"
      - "知ってますか?"
      - "知ってますか？"
      - "知っていますか"
      - "知っていますか?"
      - "知っていますか？"
    phrase: "確認するね。"
  - keywords:
      - "やって"
      - "動かして"
      - "やってみて"
      - "実行して"
    phrase: "了解。やってみるね。"
  - keywords:
      - "しらべて"
      - "調べて"
      - "けんさくして"
      - "検索して"
      - "おしえて"
      - "教えて"
      - "調べてみて"
    phrase: "すぐ調べるね。"
  - keywords:
      - "みて"
      - "みせて"
      - "見て"
      - "見せて"
      - "確認して"
      - "確認してみて"
    phrase: "今見てみるね。"
  - keywords:
      - "どこ"
      - "どこだっけ"
      - "どこだっけ？"
      - "どこだっけ?"
      - "どこだったっけ"
      - "どこだったっけ？"
      - "どこだったっけ?"
      - "どこですか"
      - "どこですか？"
      - "どこですか?"
      - "どこにある"
      - "どこにある？"
      - "どこにある?"
    phrase: "調べてみるね。"
  - keywords:
      - "ないよね"
      - "ないよね？"
      - "ないよね?"
    phrase: "調べてみるね。"
