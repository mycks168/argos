<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* 地図タイル用のシンプルなダークモードフィルター */
    .leaflet-tile-container {
      filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%);
    }
    .leaflet-container {
      background: #0d151c !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // クエリパラメータの解析
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 35.6895; // デフォルトは東京
    const lng = parseFloat(params.get('lng')) || 139.6917;
    const zoom = parseInt(params.get('zoom')) || 13;

    // 地図の初期化
    const map = L.map('map', {
      zoomControl: false // すっきりしたダッシュボード外観にするためズームコントロールを非表示に
    }).setView([lat, lng], zoom);

    // OpenStreetMapタイルレイヤーを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // マーカーピンを追加
    L.marker([lat, lng]).addTo(map);
  </script>
</body>
</html>
