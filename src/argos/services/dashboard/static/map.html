<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* 地図タイル用のシンプルなダークモードフィルター */
    .leaflet-tile-container {
      filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%);
    }
    .leaflet-container {
      background: #0d151c !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // クエリパラメータの解析
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 35.6895; // デフォルトは東京
    const lng = parseFloat(params.get('lng')) || 139.6917;
    const zoom = parseInt(params.get('zoom')) || 13;
    const curLat = parseFloat(params.get('cur_lat'));
    const curLng = parseFloat(params.get('cur_lng'));

    // 地図の初期化
    const map = L.map('map', {
      zoomControl: false // すっきりしたダッシュボード外観にするためズームコントロールを非表示に
    }).setView([lat, lng], zoom);

    // OpenStreetMapタイルレイヤーを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // マーカーと位置調整
    if (!isNaN(curLat) && !isNaN(curLng)) {
      // 現在地に青いサークルとマーカーを追加
      L.circle([curLat, curLng], {
        color: '#69b7e4',
        fillColor: '#69b7e4',
        fillOpacity: 0.2,
        radius: 300
      }).addTo(map);

      const curMarker = L.marker([curLat, curLng]).addTo(map).bindPopup("現在地").openPopup();
      const destMarker = L.marker([lat, lng]).addTo(map).bindPopup(params.get('title') || "目的地");

      // 現在地と目的地が両方収まるように地図範囲を自動調整
      const group = new L.featureGroup([curMarker, destMarker]);
      map.fitBounds(group.getBounds().pad(0.3));
    } else {
      // 目的地のみ表示
      L.marker([lat, lng]).addTo(map).bindPopup(params.get('title') || "目的地").openPopup();
    }
  </script>
</body>
</html>
