<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* 地図タイル用のシンプルなダークモードフィルター */
    .leaflet-tile-container {
      filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%);
    }
    .leaflet-container {
      background: #0d151c !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // クエリパラメータの解析
    const params = new URLSearchParams(window.location.search);
    const curLat = parseFloat(params.get('cur_lat'));
    const curLng = parseFloat(params.get('cur_lng'));

    // 地図の初期化
    const map = L.map('map', {
      zoomControl: false // すっきりしたダッシュボード外観にするためズームコントロールを非表示に
    });

    // OpenStreetMapタイルレイヤーを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = [];

    // 現在地の描画
    if (!isNaN(curLat) && !isNaN(curLng)) {
      // 現在地に青いサークルとマーカーを追加
      L.circle([curLat, curLng], {
        color: '#69b7e4',
        fillColor: '#69b7e4',
        fillOpacity: 0.2,
        radius: 400
      }).addTo(map);

      const curMarker = L.marker([curLat, curLng]).addTo(map).bindPopup("現在地").openPopup();
      markers.push(curMarker);
    }

    // 複数目的地の描画 (points=lat,lng,title|lat,lng,title...)
    const pointsParam = params.get('points');
    if (pointsParam) {
      const pointStrings = pointsParam.split('|');
      pointStrings.forEach(pStr => {
        const parts = pStr.split(',');
        if (parts.length >= 2) {
          const lat = parseFloat(parts[0]);
          const lng = parseFloat(parts[1]);
          const title = parts[2] || "目的地";
          if (!isNaN(lat) && !isNaN(lng)) {
            const marker = L.marker([lat, lng]).addTo(map).bindPopup(title);
            markers.push(marker);
          }
        }
      });
    } else {
      // 従来の単一目的地 (lat, lng, title)
      const lat = parseFloat(params.get('lat')) || 35.6895;
      const lng = parseFloat(params.get('lng')) || 139.6917;
      const title = params.get('title') || "目的地";
      if (!isNaN(lat) && !isNaN(lng)) {
        const marker = L.marker([lat, lng]).addTo(map).bindPopup(title);
        markers.push(marker);
        if (markers.length === 1 && !markers.includes(marker)) {
          marker.openPopup();
        }
      }
    }

    // 地図範囲の自動調整
    if (markers.length > 0) {
      const group = new L.featureGroup(markers);
      if (markers.length === 1) {
        map.setView(markers[0].getLatLng(), parseInt(params.get('zoom')) || 13);
      } else {
        map.fitBounds(group.getBounds().pad(0.25));
      }
    } else {
      map.setView([35.6895, 139.6917], 13);
    }
  </script>
</body>
</html>
