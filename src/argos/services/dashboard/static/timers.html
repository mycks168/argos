<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARGOS TIMERS</title>
<style>
  /* 複数タイマーの一覧。見た目は timer.html（1つ用のリング表示）に合わせる。
     終わる絶対時刻（e）を基準に描くため、表示の遅れの影響を受けない。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #101828 0%, #05080f 70%);
    color: #e2e8f0;
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin;
    padding: 3vmin;
  }
  .heading { font-size: 3vmin; letter-spacing: 0.5em; text-indent: 0.5em; color: #7dd3fc; opacity: 0.85; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; width: 100%; }
  .timer { --accent: #22d3ee; display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
  .ring-box { position: relative; width: var(--size, 30vmin); height: var(--size, 30vmin); }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #1e293b; stroke-width: 6; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
             filter: drop-shadow(0 0 0.8vmin var(--accent)); transition: stroke 0.5s; }
  .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .time { font-size: calc(var(--size, 30vmin) * 0.2); font-weight: 300; font-variant-numeric: tabular-nums; color: #f8fafc; }
  .label { font-size: 3.2vmin; max-width: var(--size, 30vmin); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer.done .time { animation: pulse 1s ease-in-out infinite; color: #fca5a5; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .empty { font-size: 3.5vmin; color: #64748b; }
</style>
</head>
<body>
<div class="heading">TIMERS</div>
<div class="grid" id="grid"></div>
<script>
  // URLの t に、タイマーの名前（l）・終わる時刻（e、ミリ秒）・長さ（s、秒）の配列が入っている。
  // サーバーには問い合わせず、ここで残り時間を数える（skills/timer/scripts/argos_timer.py が出し直す）。
  const CIRC = 2 * Math.PI * 46;

  function parseTimers(search) {
    try {
      const list = JSON.parse(new URLSearchParams(search).get("t") || "[]");
      if (!Array.isArray(list)) return [];
      return list
        .filter(item => item && typeof item.l === "string" && Number.isFinite(Number(item.e)))
        .map(item => ({ label: item.l, endsAt: Number(item.e), totalMs: Math.max(1, Number(item.s) || 60) * 1000 }))
        .sort((a, b) => a.endsAt - b.endsAt);
    } catch (_err) {
      return [];
    }
  }

  // 残りミリ秒を「1:02:03」「02:45」の形にする。0以下は「00:00」。
  function formatRemain(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = String(total % 60).padStart(2, "0");
    return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${seconds}` : `${String(minutes).padStart(2, "0")}:${seconds}`;
  }

  // 残り時間に応じた色（timer.html と同じく シアン → 琥珀 → 赤）。
  function accentFor(ms) {
    return ms <= 10000 ? "#ef4444" : ms <= 30000 ? "#f59e0b" : "#22d3ee";
  }

  // 数が多いほどリングを小さくする。
  function ringSize(count) {
    return count <= 1 ? 56 : count === 2 ? 40 : count <= 4 ? 30 : 22;
  }

  function escapeText(value) {
    return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function build(grid, timers) {
    grid.style.setProperty("--size", `${ringSize(timers.length)}vmin`);
    grid.innerHTML = timers.length ? timers.map(timer => `
      <div class="timer">
        <div class="ring-box">
          <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="46"></circle>
            <circle class="ring-fg" cx="50" cy="50" r="46" style="stroke-dasharray:${CIRC}"></circle></svg>
          <div class="center"><div class="time">--:--</div></div>
        </div>
        <div class="label">${escapeText(timer.label)}</div>
      </div>`).join("") : `<div class="empty">タイマーはありません</div>`;
  }

  function update(grid, timers, now) {
    grid.querySelectorAll(".timer").forEach((el, index) => {
      const timer = timers[index];
      const remain = timer.endsAt - now;
      el.querySelector(".time").textContent = formatRemain(remain);
      el.querySelector(".ring-fg").style.strokeDashoffset = CIRC * (1 - Math.max(0, remain) / timer.totalMs);
      el.style.setProperty("--accent", accentFor(remain));
      el.classList.toggle("done", remain <= 0);
    });
  }

  const grid = document.getElementById("grid");
  if (grid) {
    const timers = parseTimers(location.search);
    build(grid, timers);
    const tick = () => { update(grid, timers, Date.now()); requestAnimationFrame(tick); };
    tick();
  }
</script>
</body>
</html>
