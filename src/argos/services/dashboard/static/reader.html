<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Reader</title>
  <style>
    :root {
      color-scheme: dark;
      background: #0b1117;
      color: #edf3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      min-height: 100vh;
      line-height: 1.6;
      overflow-y: auto;
    }
    .markdown-body {
      max-width: 800px;
      margin: 0 auto;
    }
    /* シンプルなMarkdownスタイル */
    h1, h2, h3, h4 {
      color: #f4d35e;
      border-bottom: 1px solid #26323b;
      padding-bottom: 6px;
      margin-top: 24px;
      margin-bottom: 16px;
    }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    p, ul, ol {
      margin-bottom: 16px;
    }
    li {
      margin-top: 4px;
    }
    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 85%;
    }
    pre {
      background: #070b0f;
      padding: 16px;
      border-radius: 8px;
      overflow: auto;
      border: 1px solid #26323b;
    }
    pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 100%;
    }
    blockquote {
      border-left: 4px solid #69b7e4;
      color: #8ca0ad;
      padding-left: 16px;
      margin: 0 0 16px 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
    }
    th, td {
      border: 1px solid #26323b;
      padding: 8px 12px;
    }
    th {
      background: #101820;
      color: #f4d35e;
    }
    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }
    a {
      color: #69b7e4;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    /* スクロールバーのスタイル設定 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1117;
    }
    ::-webkit-scrollbar-thumb {
      background: #26323b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #354855;
    }
  </style>
</head>
<body>
  <div class="markdown-body" id="content">データを待機中...</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const contentEl = document.getElementById("content");

    function renderMarkdown(md) {
      if (!md) {
        contentEl.innerHTML = "<p style='color:#738591;'>コンテンツがありません。</p>";
        return;
      }
      try {
        contentEl.innerHTML = marked.parse(md);
      } catch (e) {
        contentEl.innerText = "Markdownのレンダリングに失敗しました: " + e.message;
      }
    }

    // 親ダッシュボードからの postMessage 通信を処理
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg && msg.type === "content") {
        renderMarkdown(msg.data);
      }
    });

    // クエリパラメータでMarkdownが渡された場合の処理（フォールバック）
    const params = new URLSearchParams(window.location.search);
    const textParam = params.get("text");
    if (textParam) {
      renderMarkdown(decodeURIComponent(textParam));
    }
  </script>
</body>
</html>
