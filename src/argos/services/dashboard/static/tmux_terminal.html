<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#101820; color:#edf3f7; }
    body { display:flex; flex-direction:column; font:12px system-ui,sans-serif; }
    nav { display:flex; align-items:center; gap:8px; padding:3px 6px; min-height:24px; }
    #status { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    button { background:#101820; color:inherit; border:1px solid #526775; cursor:pointer; }
    #terminal { flex:1; min-height:0; padding:2px; }
  </style>
</head>
<body>
  <nav><span id="status" role="status">接続準備中</span><button id="voice" type="button">音声入力</button><button id="discard" type="button">入力取消</button><button id="reconnect" type="button">再接続</button></nav>
  <div id="terminal" aria-label="エージェントのターミナル"></div>
  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/tmux_terminal.js"></script>
</body>
</html>
