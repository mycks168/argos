[project]
name = "argos"
version = "0.1.0"
description = "ARGOS: Autonomous Road Guardian & Observation System"
requires-python = ">=3.11"
dependencies = [
    "adafruit-circuitpython-rgb-display",
    "gpiozero",
    "lgpio",
    "pillow",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
face = [
    "opencv-python-headless",
]
kokoro = [
    "kokoro>=0.9.4",
    "misaki[ja]>=0.9.4",
    "soundfile>=0.13.1",
]
whisper = [
    "faster-whisper>=1.2.1",
]
wakeword = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
]

[project.scripts]
argos = "argos.main:main"
argos-agent-runner = "argos.agent_runner_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=argos --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/argos/hardware/gpio.py",
    "src/argos/main.py",
]
